<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKA — Data Viewer</title>
  <meta name="description" content="Workspace data viewer untuk ARKA Assistant: files, prompts, and links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --bg-surface: #121215;
      --bg-surface-hover: #18181b;
      --bg-elevated: #1f1f23;
      --border: #27272a;
      --border-focus: #52525b;
      
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      
      --badge-bg: #27272a;
      --badge-text: #d4d4d8;
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.5;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Top Navigation / Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-logo {
      width: 28px;
      height: 28px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fafafa;
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .header-meta {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .server-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
    }

    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #71717a;
    }

    .status-indicator.online {
      background: #e4e4e7;
    }

    /* Stats Overview Strip */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--text-main);
    }

    /* Controls Bar: Search & Filter Tabs */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2px;
      gap: 2px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid #3f3f46;
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      background: #18181b;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    /* Content Data List */
    .data-table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .data-list {
      display: flex;
      flex-direction: column;
    }

    .data-row {
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-row:hover {
      background: var(--bg-surface-hover);
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.35rem;
      gap: 1rem;
    }

    .row-title-area {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .row-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .row-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      word-break: break-all;
    }

    .row-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .row-title a:hover {
      text-decoration: underline;
    }

    .row-type-badge {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #3f3f46;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      font-family: var(--font-mono);
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      color: var(--text-main);
      border-color: var(--border-focus);
      background: var(--bg-elevated);
    }

    .btn-delete {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #71717a;
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.15s ease;
    }

    .btn-delete:hover {
      color: #f87171;
      border-color: #7f1d1d;
      background: rgba(127, 29, 29, 0.15);
    }

    .btn-delete.confirming {
      color: #f87171;
      border-color: #991b1b;
      background: rgba(127, 29, 29, 0.2);
    }

    .row-body {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 0.5rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .row-body.code-preview {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: #09090b;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid #27272a;
      max-height: 180px;
      overflow-y: auto;
    }

    .row-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      flex-wrap: wrap;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .empty-state {
      padding: 3.5rem 1.5rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    /* Loading placeholder */
    .loading-state {
      padding: 2rem;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <header>
      <div class="header-brand">
        <div class="header-logo">A</div>
        <div>
          <div class="header-title">ARKA Storage Viewer</div>
          <div class="header-meta">Local repository data explorer</div>
        </div>
      </div>
      <div id="statusPill" class="server-status">
        <div id="statusIndicator" class="status-indicator"></div>
        <span id="statusText">checking server...</span>
      </div>
    </header>

    <!-- Stats Overview Strip -->
    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Files</div>
        <div id="statFiles" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Prompts & Notes</div>
        <div id="statPrompts" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Links</div>
        <div id="statLinks" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Storage Used</div>
        <div id="statStorage" class="stat-value">0 B</div>
      </div>
    </section>

    <!-- Filter & Search Bar -->
    <div class="controls-bar">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all')">
          <span>All Items</span>
          <span id="countAll" class="tab-count">0</span>
        </button>
        <button class="tab-btn" onclick="setFilter('files')">
          <span>Files</span>
          <span id="countFiles" class="tab-count">0</span>
        </button>
        <button class="tab-btn" onclick="setFilter('prompts')">
          <span>Prompts</span>
          <span id="countPrompts" class="tab-count">0</span>
        </button>
        <button class="tab-btn" onclick="setFilter('links')">
          <span>Links</span>
          <span id="countLinks" class="tab-count">0</span>
        </button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search keywords..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- Data List Table Container -->
    <main class="data-table-container">
      <div id="dataList" class="data-list">
        <div class="loading-state">Loading records...</div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = '/api';
    let allData = {
      files: [],
      prompts: [],
      links: []
    };
    let currentFilter = 'all';
    let searchQuery = '';

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch {
        return dateStr;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadStatus() {
      try {
        const res = await fetch(`${API_BASE}/status`);
        const json = await res.json();
        if (json.success && json.data) {
          const stats = json.data.stats || {};
          document.getElementById('statFiles').textContent = stats.totalFiles || 0;
          document.getElementById('statPrompts').textContent = stats.prompts || 0;
          document.getElementById('statLinks').textContent = stats.links || 0;
          document.getElementById('statStorage').textContent = formatBytes(stats.totalBytes);

          document.getElementById('statusIndicator').classList.add('online');
          document.getElementById('statusText').textContent = 'core online';
        }
      } catch (err) {
        document.getElementById('statusText').textContent = 'disconnected';
      }
    }

    async function fetchAllData() {
      try {
        const [filesRes, promptsRes, linksRes] = await Promise.all([
          fetch(`${API_BASE}/files`).then(r => r.json()),
          fetch(`${API_BASE}/prompts`).then(r => r.json()),
          fetch(`${API_BASE}/links`).then(r => r.json())
        ]);

        allData.files = Array.isArray(filesRes.data) ? filesRes.data : [];
        allData.prompts = Array.isArray(promptsRes.data) ? promptsRes.data : [];
        allData.links = Array.isArray(linksRes.data) ? linksRes.data : [];

        // Update counts
        document.getElementById('countFiles').textContent = allData.files.length;
        document.getElementById('countPrompts').textContent = allData.prompts.length;
        document.getElementById('countLinks').textContent = allData.links.length;
        document.getElementById('countAll').textContent = allData.files.length + allData.prompts.length + allData.links.length;

        render();
      } catch (err) {
        document.getElementById('dataList').innerHTML = `
          <div class="empty-state">Failed to load data: ${escapeHtml(err.message)}</div>
        `;
      }
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['all', 'files', 'prompts', 'links'][idx] === type);
      });
      render();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      render();
    }

    function render() {
      const container = document.getElementById('dataList');
      let combined = [];

      if (currentFilter === 'all' || currentFilter === 'files') {
        allData.files.forEach(f => combined.push({
          type: 'FILE',
          id: f.id,
          title: f.original_name,
          category: f.folder_name || (f.is_inbox ? 'inbox' : 'root'),
          desc: f.description || '',
          metaRight: formatBytes(f.size),
          date: f.created_at,
          subInfo: f.tags ? `tags: ${f.tags}` : '',
          raw: f
        }));
      }

      if (currentFilter === 'all' || currentFilter === 'prompts') {
        allData.prompts.forEach(p => combined.push({
          type: 'PROMPT',
          id: p.id,
          title: p.title,
          category: p.category || 'General',
          desc: p.content,
          metaRight: p.tags ? `tags: ${p.tags}` : '',
          date: p.created_at,
          subInfo: '',
          raw: p
        }));
      }

      if (currentFilter === 'all' || currentFilter === 'links') {
        allData.links.forEach(l => combined.push({
          type: 'LINK',
          id: l.id,
          title: l.title || l.domain || l.url,
          category: l.category || 'General',
          desc: l.description || l.url,
          metaRight: l.domain || '',
          date: l.created_at,
          url: l.url,
          subInfo: l.tags ? `tags: ${l.tags}` : '',
          raw: l
        }));
      }

      // Filter by search query
      if (searchQuery) {
        combined = combined.filter(item => {
          const matchTitle = item.title.toLowerCase().includes(searchQuery);
          const matchDesc = item.desc.toLowerCase().includes(searchQuery);
          const matchCategory = item.category.toLowerCase().includes(searchQuery);
          const matchSub = (item.subInfo || '').toLowerCase().includes(searchQuery);
          const matchUrl = (item.url || '').toLowerCase().includes(searchQuery);
          return matchTitle || matchDesc || matchCategory || matchSub || matchUrl;
        });
      }

      // Sort by date newest first
      combined.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      if (combined.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            No records found.
          </div>
        `;
        return;
      }

      container.innerHTML = combined.map(item => {
        let actionBtn = '';
        if (item.type === 'FILE') {
          actionBtn = `<a href="/api/files/${item.id}/download" class="btn-action" target="_blank">download</a>`;
        } else if (item.type === 'LINK') {
          actionBtn = `<a href="${item.url}" class="btn-action" target="_blank" rel="noopener noreferrer">open link</a>`;
        }

        const isPrompt = item.type === 'PROMPT';
        const bodyClass = isPrompt ? 'row-body code-preview' : 'row-body';
        const deleteId = `del-${item.type}-${item.id}`;

        return `
          <div class="data-row" id="row-${item.type}-${item.id}">
            <div class="row-header">
              <div class="row-title-area">
                <span class="row-id">#${item.id}</span>
                <span class="row-title">
                  ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>` : escapeHtml(item.title)}
                </span>
                <span class="row-type-badge">${item.type}</span>
                <span class="row-type-badge">${escapeHtml(item.category)}</span>
              </div>
              <div class="row-actions">
                ${actionBtn}
                <button
                  id="${deleteId}"
                  class="btn-delete"
                  onclick="handleDelete('${item.type}', ${item.id}, '${deleteId}')"
                >delete</button>
              </div>
            </div>

            ${item.desc ? `<div class="${bodyClass}">${escapeHtml(item.desc)}</div>` : ''}

            <div class="row-meta">
              <span class="meta-item">${formatDate(item.date)}</span>
              ${item.metaRight ? `<span class="meta-item">${escapeHtml(item.metaRight)}</span>` : ''}
              ${item.subInfo ? `<span class="meta-item">${escapeHtml(item.subInfo)}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Delete with two-click confirmation (first click: confirm label, second click: execute)
    const deleteConfirmState = {};

    async function handleDelete(type, id, btnId) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      if (!deleteConfirmState[btnId]) {
        // First click — show confirm state
        deleteConfirmState[btnId] = true;
        btn.textContent = 'confirm?';
        btn.classList.add('confirming');

        // Auto-reset after 3 seconds if no second click
        setTimeout(() => {
          if (deleteConfirmState[btnId]) {
            delete deleteConfirmState[btnId];
            if (btn) {
              btn.textContent = 'delete';
              btn.classList.remove('confirming');
            }
          }
        }, 3000);
        return;
      }

      // Second click — execute delete
      delete deleteConfirmState[btnId];
      btn.textContent = 'deleting...';
      btn.disabled = true;

      let endpoint = '';
      // Files use ?permanent=true — without it the server only soft-deletes to trash
      if (type === 'FILE') endpoint = `/api/files/${id}?permanent=true`;
      else if (type === 'PROMPT') endpoint = `/api/prompts/${id}`;
      else if (type === 'LINK') endpoint = `/api/links/${id}`;

      try {
        const res = await fetch(endpoint, { method: 'DELETE' });
        const json = await res.json();

        if (json.success || res.ok) {
          // Remove row from DOM immediately
          const row = document.getElementById(`row-${type}-${id}`);
          if (row) {
            row.style.opacity = '0';
            row.style.transition = 'opacity 0.2s ease';
            setTimeout(() => row.remove(), 200);
          }

          // Remove from local data cache (id from the API is a number, compare strictly)
          const numId = Number(id);
          if (type === 'FILE') allData.files = allData.files.filter(x => Number(x.id) !== numId);
          else if (type === 'PROMPT') allData.prompts = allData.prompts.filter(x => Number(x.id) !== numId);
          else if (type === 'LINK') allData.links = allData.links.filter(x => Number(x.id) !== numId);

          // Update tab counts
          document.getElementById('countFiles').textContent = allData.files.length;
          document.getElementById('countPrompts').textContent = allData.prompts.length;
          document.getElementById('countLinks').textContent = allData.links.length;
          document.getElementById('countAll').textContent = allData.files.length + allData.prompts.length + allData.links.length;

          // Refresh stats strip
          loadStatus();
        } else {
          btn.textContent = 'error';
          btn.style.color = '#f87171';
          setTimeout(() => {
            btn.textContent = 'delete';
            btn.style.color = '';
            btn.disabled = false;
          }, 2000);
        }
      } catch (err) {
        btn.textContent = 'error';
        setTimeout(() => {
          btn.textContent = 'delete';
          btn.disabled = false;
        }, 2000);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStatus();
      fetchAllData();
    });
  </script>
</body>
</html>
